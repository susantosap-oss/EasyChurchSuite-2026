<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="0.55" stop-color="#312e81"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cross" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="0.5" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tile"><rect x="16" y="16" width="480" height="480" rx="108"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
  <rect x="16" y="16" width="480" height="480" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="300" fill="url(#shine)"/>
  <circle cx="256" cy="216" r="230" fill="url(#glow)"/>
  <!-- light rays -->
  <g stroke="#fde68a" stroke-opacity="0.35" stroke-width="10" stroke-linecap="round">
    <line x1="256" y1="196" x2="96"  y2="120"/>
    <line x1="256" y1="196" x2="416" y2="120"/>
    <line x1="256" y1="196" x2="84"  y2="236"/>
    <line x1="256" y1="196" x2="428" y2="236"/>
  </g>
  <!-- cross -->
  <g fill="url(#cross)">
    <rect x="221" y="84" width="70" height="344" rx="16"/>
    <rect x="136" y="166" width="240" height="70" rx="16"/>
  </g>
  </g>
</svg>
